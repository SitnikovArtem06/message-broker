services:
  postgres:
    image: postgres:16-alpine
    container_name: message-broker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-message_broker}
      POSTGRES_USER: ${DB_USER:-message_broker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-message_broker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
